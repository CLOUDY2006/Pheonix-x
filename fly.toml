# fly launch --no-deploy --copy-config && fly volumes create phoenix_data --size 1 && fly secrets set PHOENIX_SETUP_TOKEN=$(openssl rand -hex 16) && fly deploy
app = "phoenix-x-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PHOENIX_MODE = "production"
  PHOENIX_TRUST_PROXY = "on"
  PHOENIX_REQUIRE_ADMIN_TOTP = "on"
  PHOENIX_BACKUP_EVERY_HOURS = "6"
  PORT = "3000"

[[mounts]]
  source = "phoenix_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
